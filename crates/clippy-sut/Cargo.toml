[package]
name = "photocraft-clippy-sut"
description = "Reader and writer for Clip Studio Paint sub tool files (.sut), tool databases (.todb) and brush tip materials (.layer)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "photocraft_clippy_sut"
path = "src/lib.rs"

[features]
# Synthetic file builders for tests, examples and fuzz seeds.
synth = []

[dependencies]
flate2 = { workspace = true }
thiserror = { workspace = true }

# SQLite and the tar archives inside .sut files are desktop-only (wasm: L5). The .layer codec, the
# blob codecs and the model stay available everywhere.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "serialize"] }
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
photocraft-clippy-sut = { path = ".", features = ["synth"] }
image = { workspace = true, features = ["png"] }
proptest = { workspace = true }

[lints]
workspace = true
